# Netlify configuration for IWS website

[build]
  publish = "."

# Serve custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
